<!DOCTYPE html>
<html lang="it" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Engineer Toolkit | Modulo Linee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#0284c7' } } } }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        .form-input {
            width: 100%; border: 1px solid #334155; border-radius: 0.5rem; padding: 0.75rem; 
            font-size: 0.875rem; color: #f8fafc; background-color: #0f172a !important; transition: all 0.2s;
        }
        .form-input:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2); }
        .form-input option { background-color: #0f172a; color: #f8fafc; }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i data-lucide="zap" class="w-5 h-5 text-sky-400"></i>
                <span class="font-bold text-lg tracking-tight text-white">Dimensionamento Linea</span>
            </div>
            <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">CEI 64-8</span>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6">
        <div class="bg-slate-800/80 border border-slate-700/80 p-5 rounded-xl">
            <form id="cable-form" class="space-y-5">
                
                <!-- Input di Cantiere (Primari) -->
                <div class="grid grid-cols-2 gap-4 border-b border-slate-700 pb-5">
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-semibold text-sky-400 mb-1 uppercase">Potenza Attiva (kW)</label>
                        <input type="number" id="c-power" step="0.1" min="0.1" value="15" class="form-input text-lg font-bold" required>
                    </div>
                    <div class="col-span-2 sm:col-span-1">
                        <label class="block text-xs font-semibold text-sky-400 mb-1 uppercase">Sistema (V)</label>
                        <select id="c-system" class="form-input text-lg font-bold">
                            <option value="400">Trifase (400V)</option>
                            <option value="230">Monofase (230V)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Tipo di Cavo</label>
                        <select id="c-type" class="form-input">
                            <option value="Cu-EPR">Rame - EPR/XLPE (FG16)</option>
                            <option value="Cu-PVC">Rame - PVC (FS17)</option>
                            <option value="Al-EPR">Alluminio - EPR/XLPE</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Metodo di Posa</label>
                        <select id="c-installation" class="form-input">
                            <option value="B1">B1 - Tubo in muratura / A vista</option>
                            <option value="C">C - Cavo a parete / Muro</option>
                            <option value="E">E - Passerella / Aria libera</option>
                        </select>
                    </div>
                </div>

                <!-- Input Secondari (Con Default) -->
                <details class="group">
                    <summary class="text-xs text-slate-400 cursor-pointer hover:text-sky-400 flex items-center gap-1 mt-2">
                        <i data-lucide="settings-2" class="w-3 h-3"></i> Parametri Avanzati (cos&phi;, Lunghezza)
                    </summary>
                    <div class="grid grid-cols-2 gap-4 mt-3 pt-3 border-t border-slate-700/50">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Lunghezza (m)</label>
                            <input type="number" id="c-length" step="1" min="1" value="50" class="form-input">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Fattore di Potenza</label>
                            <input type="number" id="c-cosphi" step="0.01" min="0.5" max="1.0" value="0.9" class="form-input">
                        </div>
                    </div>
                </details>

            </form>
        </div>

        <!-- Output Panel -->
        <div class="mt-6 bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-lg">
            <div class="bg-slate-800 px-4 py-2 border-b border-slate-700">
                <span class="text-xs font-semibold text-slate-300 uppercase">Risultato Dimensionamento</span>
            </div>
            
            <div class="p-5">
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">Corrente Impiego (Ib)</span>
                        <span id="out-ib" class="text-3xl font-mono font-bold text-slate-100">- A</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-400 block mb-1">Sezione Minima</span>
                        <span id="out-section" class="text-3xl font-mono font-bold text-sky-400">- mm²</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                    <div>
                        <span class="text-xs text-slate-500 block">Portata Tabellare (Iz)</span>
                        <span id="out-iz" class="text-lg font-mono text-emerald-400 font-semibold">- A</span>
                    </div>
                    <div>
                        <span class="text-xs text-slate-500 block">Caduta Tensione (&Delta;U)</span>
                        <span id="out-vdrop" class="text-lg font-mono text-amber-400 font-semibold">- %</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="./js/app.js"></script>
</body>
</html>
